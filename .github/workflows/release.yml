name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Extract Tag or Version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v0.1.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/AndreaPallotta/vantage/cmd.Version=${VERSION} -X github.com/AndreaPallotta/vantage/cmd.CommitSHA=${GITHUB_SHA::7} -X github.com/AndreaPallotta/vantage/cmd.BuildDate=${BUILD_DATE}"

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/vantage-windows-amd64.exe .
          # Windows arm64
          GOOS=windows GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/vantage-windows-arm64.exe .
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/vantage-linux-amd64 .
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/vantage-linux-arm64 .
          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/vantage-darwin-amd64 .
          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/vantage-darwin-arm64 .

      - name: Package Archives
        run: |
          cd dist
          tar -czvf vantage-${VERSION}-linux-amd64.tar.gz vantage-linux-amd64
          tar -czvf vantage-${VERSION}-linux-arm64.tar.gz vantage-linux-arm64
          tar -czvf vantage-${VERSION}-darwin-amd64.tar.gz vantage-darwin-amd64
          tar -czvf vantage-${VERSION}-darwin-arm64.tar.gz vantage-darwin-arm64
          zip vantage-${VERSION}-windows-amd64.zip vantage-windows-amd64.exe
          zip vantage-${VERSION}-windows-arm64.zip vantage-windows-arm64.exe
          cd ..

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "Vantage Release ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
